  --tv-metric-pad-x: 1.35rem;
  --tv-footer-text: 1.05rem;
  --tv-footer-pad-y: 1.5rem;
  --tv-footer-pad-x: 4rem;
  --tv-visual: 14rem;
  --tv-off-title: 4rem;
  --tv-off-sub: 1.85rem;

  display: -webkit-flex;

  max-height: 100vh;

.tv-clock-wrap {

.tv-body {

.tv-intro {

  right: 0;
  bottom: 0;

  function syncServerClock(serverTs) {

  function bogotaParts(date) {
    try {
      var timeParts = new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/Bogota',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false,
        year: 'numeric',
        month: 'numeric',
        day: 'numeric'
      }).formatToParts(date);

      function get(type) {
        var i;
        for (i = 0; i < timeParts.length; i++) {
          if (timeParts[i].type === type) return timeParts[i].value;
        }
        return '';
      }

      var hours = get('hour');
      if (hours === '24') hours = '00';
      var weekday = new Intl.DateTimeFormat('es-CO', {
        timeZone: 'America/Bogota',
        weekday: 'long'
      })
        .format(date)
        .toLowerCase();
      var monthIdx = Math.max(0, Number(get('month')) - 1);
      var dayNum = Number(get('day'));
      var year = get('year');

      return {
        hours: pad(Number(hours) || 0),
        minutes: pad(Number(get('minute')) || 0),
        seconds: pad(Number(get('second')) || 0),
        dateLabel: weekday + ', ' + dayNum + ' de ' + (MONTHS_ES[monthIdx] || '') + ' de ' + year
      };
    } catch (e) {
      return {
        hours: pad(date.getHours()),
        minutes: pad(date.getMinutes()),
        seconds: pad(date.getSeconds()),
        dateLabel: pad(date.getDate()) + '/' + pad(date.getMonth() + 1) + '/' + date.getFullYear()

    }
  }

  function $(id) {

  function pad(n) {
    return (n < 10 ? '0' : '') + n;
  }

  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function fixAssetUrl(url) {
    if (!url) return url;
    return String(url).replace('/cset-svelte/public/', '/tv/').replace('/cset/public/', '/tv/').replace('/cset/', '/tv/');
  }

  /** Precarga en memoria para que el ciclo de slides no vuelva a descargar/decodificar en frío. */
  function preloadMedia(url, kind) {
    if (!url || state.mediaCache[url]) return;
    if (kind === 'video') {
      /* Signage webOS: no precargar videos con auto (un decoder / poca RAM). */

      v.preload = 'metadata';
      v.muted = true;
      v.setAttribute('playsinline', '');
      v.setAttribute('webkit-playsinline', '');
      v.src = url;
      try {
        v.load();
      } catch (e) {}
      state.mediaCache[url] = v;
      return;
    }
    var img = new Image();
    img.src = url;
    state.mediaCache[url] = img;
  }

    var name;
    var i;
    var slide;
    var url;
    if (!scenarios) return;
    for (name in scenarios) {
      if (!Object.prototype.hasOwnProperty.call(scenarios, name)) continue;
      for (i = 0; i < scenarios[name].length; i++) {
        slide = scenarios[name][i];
        url = fixAssetUrl(slide.media_url || slide.image_url);
        if (!url) continue;
        preloadMedia(url, slide.media_type === 'video' ? 'video' : 'image');

  function runBootIntro(logoUrl) {
    return new Promise(function (resolve) {
      var intro = document.getElementById('tv-intro');
      var logoEl = document.getElementById('tv-intro-logo');
      var brandEl = document.getElementById('tv-intro-brand');
      var subEl = document.getElementById('tv-intro-sub');
      if (!intro || !logoEl || !logoUrl) {
        resolve();
        return;
      }
      var brand =
        (state.config && state.config.branding_title) || 'CSET - Cartelera Digital';
      var sub =
        (state.config && state.config.branding_subtitle) ||
        'Información institucional en tiempo real';
      if (brandEl) brandEl.textContent = brand;
      if (subEl) subEl.textContent = sub;

      var safe = String(logoUrl).replace(/\\/g, '\\\\').replace(/"/g, '\\"');
      var mask = 'url("' + safe + '")';
      logoEl.style.webkitMaskImage = mask;
      logoEl.style.maskImage = mask;
      intro.setAttribute('aria-hidden', 'false');
      intro.className = 'tv-intro is-active';
      preloadMedia(logoUrl, 'image');
      /* fill 4s + lectura de textos ≈ 5s, luego fade 0.6s */
      setTimeout(function () {
        intro.className = 'tv-intro is-active is-fading';
        setTimeout(function () {
          intro.className = 'tv-intro is-done';
          intro.setAttribute('aria-hidden', 'true');
          resolve();
        }, 600);
      }, 5000);
    });

  function fetchJson(path) {
    var url = API_BASE + path + (path.indexOf('?') >= 0 ? '&' : '?') + '_=' + Date.now();
    /* Sin credentials: el feed TV es público; evita fallos con cookies Secure en HTTP. */
    return fetch(url, { credentials: 'omit', cache: 'no-store' }).then(function (res) {
      return res.text().then(function (text) {
        var data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          throw new Error('Respuesta no JSON (' + res.status + ')');
        }
        if (!res.ok || data.ok === false) {
          throw new Error((data && data.error) || 'Error de API');
        }
        return data;
      });
    });
  }

  function normalizeOrder(order) {
    var cleaned = [];
    var i;
    if (order && order.length) {
      for (i = 0; i < order.length; i++) {
        if (order[i] && String(order[i]).trim()) cleaned.push(String(order[i]).trim());
      }
    }
    return cleaned.length ? cleaned : DEFAULT_ORDER.slice();
  }

  function ensureWelcomeScenario(scenarios, order) {
    var next = scenarios || { academic: [], center: [], general: [], gallery: [] };
    if (order && order.indexOf('welcome') !== -1 && (!next.welcome || !next.welcome.length)) {
      next.welcome = [{ id: 0, title: 'Bienvenida', layout: 'bienvenida', duration: 12 }];
    }
    return next;
  }

  function isJsonDump(value) {
    var trimmed = String(value || '').trim();
    if (!(trimmed.charAt(0) === '{' || trimmed.charAt(0) === '[')) return false;
    try {
      var parsed = JSON.parse(trimmed);
      return parsed !== null && typeof parsed === 'object';
    } catch (e) {
      return false;
    }
  }

  function publicDescription(description, external) {
    if (!description || !String(description).trim()) return null;
    if (external && Object.keys(external).length) return null;
    if (isJsonDump(description)) return null;
    return description;
  }

  function formatExternalValue(value) {
    if (value === null || value === undefined) return '';
    if (typeof value === 'object') return JSON.stringify(value);
    return String(value);
  }

  function flattenExternal(external) {
    var rows = [];
    var key;
    var value;
    var subKey;
    if (!external) return rows;
    for (key in external) {
      if (!Object.prototype.hasOwnProperty.call(external, key)) continue;
      value = external[key];
      if (value !== null && typeof value === 'object' && !Array.isArray(value)) {
        for (subKey in value) {
          if (!Object.prototype.hasOwnProperty.call(value, subKey)) continue;
          rows.push([key + ' ' + subKey, formatExternalValue(value[subKey])]);
        }
      } else {
        rows.push([key, formatExternalValue(value)]);
      }
    }
    rows.sort(function (a, b) {
      var aMeta = META_KEYS[String(a[0]).toLowerCase()] ? 1 : 0;
      var bMeta = META_KEYS[String(b[0]).toLowerCase()] ? 1 : 0;
      return aMeta - bMeta;
    });
    return rows;
  }

  function resolveExternalRows(slide) {
    if (slide.external && Object.keys(slide.external).length) {
      return flattenExternal(slide.external);
    }
    if (slide.description && isJsonDump(slide.description)) {
      try {
        var parsed = JSON.parse(String(slide.description).trim());
        if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
          return flattenExternal(parsed);
        }
      } catch (e) {}
    }
    return [];
  }

  function resolveLayout(slide, scenario) {
    if (scenario === 'welcome' || slide.layout === 'bienvenida') return 'bienvenida';
    if (scenario === 'gallery' || slide.layout === 'galeria') return 'galeria';
    if (slide.layout === 'indicadores' || (slide.items && slide.items.length)) return 'indicadores';
    if (scenario === 'academic') return slide.media_url ? 'afiche' : 'evento';
    if (slide.external && Object.keys(slide.external).length) return 'anuncio';
    if (slide.media_url) return 'afiche';
    return 'anuncio';
  }

  function hexToRgba(hex, alpha) {
    var raw = String(hex || '').replace('#', '').trim();
    var full = raw.length === 3 ? raw.charAt(0) + raw.charAt(0) + raw.charAt(1) + raw.charAt(1) + raw.charAt(2) + raw.charAt(2) : raw.slice(0, 6);
    if (!/^[0-9a-fA-F]{6}$/.test(full)) return 'rgba(57, 169, 0, ' + alpha + ')';
    var n = parseInt(full, 16);
    var r = (n >> 16) & 255;
    var g = (n >> 8) & 255;
    var b = n & 255;
    return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
  }

  function setConnection(ok) {

  function stopProgress() {
    if (state.progressRaf !== null) {
      cancelAnimationFrame(state.progressRaf);
      state.progressRaf = null;
    }
  }

  function progressPalette() {
    var solid = tvChromeColor('progress');
    return {
      solid: solid,
      track: hexToRgba(solid, 0.22),
      done: hexToRgba(solid, 0.55)
    };
  }

  /** Recolorea tracks/fills según índice actual sin tocar el timer del slide. */
  function syncProgressColors() {
    var pct = 0;
    if (state.progressDuration > 0 && state.progressFrom) {
      pct = Math.min(100, ((Date.now() - state.progressFrom) / state.progressDuration) * 100);
    }
    renderProgress(pct);
  }

  function renderProgress(pct) {
    var palette = progressPalette();
    var bars = document.querySelectorAll('.tv-progress-fill');
    var tracks = document.querySelectorAll('.tv-progress-bar');
    var i;
    for (i = 0; i < tracks.length; i++) {
      tracks[i].style.backgroundColor = palette.track;
    }
    for (i = 0; i < bars.length; i++) {
      if (i < state.currentSlideIndex) {
        bars[i].className = 'tv-progress-fill is-done';
        bars[i].style.width = '100%';
        bars[i].style.backgroundColor = palette.done;
      } else if (i === state.currentSlideIndex) {
        bars[i].className = 'tv-progress-fill';
        bars[i].style.width = pct + '%';
        bars[i].style.backgroundColor = palette.solid;
      } else {
        bars[i].className = 'tv-progress-fill';
        bars[i].style.width = '0%';
        bars[i].style.backgroundColor = 'transparent';
      }
    }
  }

  function startProgress(from, duration) {
    stopProgress();
    state.progressFrom = from;
    state.progressDuration = duration;
    if (duration <= 0) {
      renderProgress(0);
      return;
    }
    function tick() {
      var now = Date.now();
      var pct = Math.min(100, ((now - from) / duration) * 100);
      renderProgress(pct);
      if (now < from + duration) {
        state.progressRaf = requestAnimationFrame(tick);
      } else {
        renderProgress(100);
        state.progressRaf = null;
      }
    }
    state.progressRaf = requestAnimationFrame(tick);
  }

  function buildProgressBars(slides) {
    var html = '';
    var i;
    var palette = progressPalette();
    for (i = 0; i < slides.length; i++) {
      html +=
        '<div class="tv-progress-bar" style="background-color:' +
        esc(palette.track) +
        '"><div class="tv-progress-fill"></div></div>';
    }
    $('tv-progress').innerHTML = html;
  }

  /** Copia del media a pantalla completa, difuminada (rellena bandas del stage). */
  function renderMediaBlur(url, isVideo) {
    var media;
    if (!url) return '';
    /* webOS Signage: un solo decoder HTML5. Nunca un segundo <video> en el blur. */
    if (isVideo) {
      return (
        '<div class="tv-media-blur tv-media-blur--solid" aria-hidden="true">' +
        '<div class="tv-media-blur-veil"></div></div>'
      );
    }
    media = '<img class="tv-media-blur-media" src="' + esc(url) + '" alt="" />';
    return (
      '<div class="tv-media-blur" aria-hidden="true">' +
      media +
      '<div class="tv-media-blur-veil"></div></div>'
    );
  }

  /** Arranca el único video del slide; si falla, avanza para no congelar la cartelera. */
  function activateSlideVideo() {
    var stage = $('tv-stage');
    var video;
    var p;
    if (!stage) return;
    video = stage.querySelector('video.tv-slide-media');
    if (!video) return;
    video.muted = true;
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    video.setAttribute('muted', '');
    video.onerror = function () {
      try {
        clearTimer();
        state.timer = setTimeout(function () {
          state.timer = null;
          nextSlide();
        }, 800);
      } catch (e1) {}
    };
    try {
      p = video.play();
      if (p && typeof p.then === 'function') {
        p.then(function () {}).catch(function () {});
      }
    } catch (e2) {}
  }

  function categoryIcon(category) {
    var key = String(category || '').toLowerCase();
    if (key.indexOf('currenc') !== -1 || key.indexOf('dollar') !== -1 || key.indexOf('trm') !== -1) {
      return ICONS['dollar-sign'] || ICONS.megaphone;

    if (key.indexOf('crypto') !== -1 || key.indexOf('bitcoin') !== -1) {
      return ICONS.bitcoin || ICONS.megaphone;

    if (key.indexOf('weather') !== -1 || key.indexOf('clima') !== -1) {
      return ICONS.cloud || ICONS.megaphone;

    if (key.indexOf('commodit') !== -1 || key.indexOf('oil') !== -1 || key.indexOf('cafe') !== -1 || key.indexOf('café') !== -1) {
      return ICONS['trending-up'] || ICONS.megaphone;

  function renderMetricsTable(rows) {
    if (!rows || !rows.length) return '';
    var dense = rows.length > 4;
    var html = '<div class="tv-metrics' + (dense ? ' tv-metrics--dense' : '') + '">';
    var i;
    var left;
    var right;

    if (!dense) {
      for (i = 0; i < rows.length; i++) {
        html +=
          '<div class="tv-metric-row"><div class="tv-metric-cell">' +
          renderMetricPair(rows[i][0], rows[i][1]) +
          '</div></div>';
      }
      html += '</div>';
      return html;
    }

    for (i = 0; i < rows.length; i += 2) {
      left = rows[i];
      right = rows[i + 1];
      html += '<div class="tv-metric-row">';
      html +=
        '<div class="tv-metric-cell">' + renderMetricPair(left[0], left[1]) + '</div>';
      if (right) {
        html +=
          '<div class="tv-metric-cell">' + renderMetricPair(right[0], right[1]) + '</div>';

        html += '<div class="tv-metric-cell">&nbsp;</div>';

      html += '</div>';

  function renderBienvenida(slide) {
    var s = slide || {};
    var chispaPath =
      '<path d="M6 20 L16 20 M20 6 L20 16 M28 28 L34 34 M30 12 L36 8"/>';
    var saludo = esc(s.saludo != null ? s.saludo : 'El conocimiento es de todos');
    var tituloRaw = s.titulo != null ? String(s.titulo) : '¡Te damos la\nbienvenida!';
    var tituloParts = tituloRaw.split(/\r\n|\r|\n/);
    var tituloHtml = '';
    var ti;
    for (ti = 0; ti < tituloParts.length; ti++) {
      if (ti > 0) tituloHtml += '<br>';
      tituloHtml += esc(tituloParts[ti]);
    }
    var centro = esc(
      s.centro != null ? s.centro : 'Centro de Servicios Empresariales y Turísticos'
    );
    var regional = esc(s.regional != null ? s.regional : 'Regional Santander');
    // lema/pie: HTML limitado (<b>) ya sanitizado en API
    var lema =
      s.lema != null && String(s.lema) !== ''
        ? String(s.lema)
        : '¿Y si <b>este fuera tu momento</b>?';
    var hashtag = esc(s.hashtag != null ? s.hashtag : '#SigueTuMomentoSENA');
    var pie =
      s.pie != null && String(s.pie) !== ''
        ? String(s.pie)
        : 'Prepárate · Fórmate · <b>Abre nuevas oportunidades</b>';
    var colors = resolveWelcomeColors(s);
    var bgUrl = s.bg_url ? fixAssetUrl(s.bg_url) : '';
    var hasBg = !!bgUrl;
    var bgImage = hasBg
      ? 'url("' + String(bgUrl).replace(/"/g, '\\"') + '")'
      : 'radial-gradient(circle at 78% 8%, #ffffff 0%, ' +
        colors.bg +
        ' 55%, ' +
        colors.bg +
        ' 100%)';
    var bgImageWebkit = hasBg
      ? bgImage
      : '-webkit-radial-gradient(78% 8%, circle, #ffffff 0%, ' +
        colors.bg +
        ' 55%, ' +
        colors.bg +
        ' 100%)';
    var style =
      '--welcome-bg:' +
      colors.bg +
      ';--welcome-saludo:' +
      colors.saludo +
      ';--welcome-titulo:' +
      colors.titulo +
      ';--welcome-centro:' +
      colors.centro +
      ';--welcome-regional:' +
      colors.regional +
      ';--welcome-lema:' +
      colors.lema +
      ';--welcome-accent:' +
      colors.accent +
      ';--welcome-hashtag:' +
      colors.hashtag +
      ';--welcome-pie:' +
      colors.pie +
      ';--welcome-deco:' +
      colors.deco +
      ';--welcome-bg-image-webkit:' +
      bgImageWebkit +
      ';--welcome-bg-image:' +
      bgImage;
    return (
      '<div class="tv-slide tv-slide--bienvenida' +
      (hasBg ? ' has-welcome-bg' : '') +
      '" style="' +
      style +
      '">' +
      '<div class="tv-bienv-fondo" aria-hidden="true">' +
      '<span class="tv-bienv-aro tv-bienv-aro--1"></span>' +
      '<span class="tv-bienv-aro tv-bienv-aro--2"></span>' +
      '</div>' +
      '<svg class="tv-bienv-chispa tv-bienv-chispa--1" viewBox="0 0 40 40" aria-hidden="true">' +
      chispaPath +
      '</svg>' +
      '<svg class="tv-bienv-chispa tv-bienv-chispa--2 tv-bienv-chispa--lima" viewBox="0 0 40 40" aria-hidden="true">' +
      chispaPath +
      '</svg>' +
      '<svg class="tv-bienv-chispa tv-bienv-chispa--3 tv-bienv-chispa--lima" viewBox="0 0 40 40" aria-hidden="true">' +
      chispaPath +
      '</svg>' +
      '<svg class="tv-bienv-chispa tv-bienv-chispa--4" viewBox="0 0 40 40" aria-hidden="true">' +
      chispaPath +
      '</svg>' +
      '<svg class="tv-bienv-chispa tv-bienv-chispa--5" viewBox="0 0 40 40" aria-hidden="true">' +
      chispaPath +
      '</svg>' +
      '<svg class="tv-bienv-chispa tv-bienv-chispa--6 tv-bienv-chispa--lima" viewBox="0 0 40 40" aria-hidden="true">' +
      chispaPath +
      '</svg>' +
      '<div class="tv-bienv-escena">' +
      '<p class="tv-bienv-saludo tv-bienv-revela tv-bienv-r1">' +
      saludo +
      '</p>' +
      '<h2 class="tv-bienv-titulo tv-bienv-revela tv-bienv-r2">' +
      tituloHtml +
      '</h2>' +
      '<p class="tv-bienv-centro tv-bienv-revela tv-bienv-r3">' +
      centro +
      '</p>' +
      '<p class="tv-bienv-regional tv-bienv-revela tv-bienv-r3">' +
      regional +
      '</p>' +
      '<span class="tv-bienv-divisor" aria-hidden="true"></span>' +
      '<p class="tv-bienv-lema tv-bienv-revela tv-bienv-r4">' +
      lema +
      '</p>' +
      '<div class="tv-bienv-hashtag tv-bienv-revela tv-bienv-r5" aria-label="' +
      hashtag +
      '">' +
      '<svg class="tv-bienv-campana" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
      '<path d="M12 3a5 5 0 0 0-5 5c0 4-2 5-2 7h14c0-2-2-3-2-7a5 5 0 0 0-5-5Z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>' +
      '<path d="M10 20a2 2 0 0 0 4 0" stroke="#fff" stroke-width="2" stroke-linecap="round"/>' +
      '</svg>' +
      hashtag +
      '</div>' +
      '<p class="tv-bienv-pie tv-bienv-revela tv-bienv-r6">' +
      pie +
      '</p>' +
      '</div></div>'
    );
  }

  function renderSlide(slide, scenario) {
    var badge = SCENARIO_SHORT[scenario] || scenario;
    var layout = resolveLayout(slide, scenario);
    if (layout === 'bienvenida') return renderBienvenida(slide);
    if (layout === 'galeria') return renderGaleria(slide);
    if (layout === 'afiche') return renderAfiche(slide, badge);
    if (layout === 'evento') return renderEvento(slide, badge);
    if (layout === 'indicadores') return renderIndicadores(slide, badge);
    return renderAnuncio(slide, scenario, badge);
  }

  function listFor(idx) {
    var name = state.order[idx % state.order.length];
    return state.scenarios[name] || [];
  }

  function findPlayable(fromIdx) {
    var i;
    var idx;
    if (!state.order.length) return null;
    for (i = 0; i < state.order.length; i++) {
      idx = (fromIdx + i) % state.order.length;
      if (listFor(idx).length) return idx;
    }
    return null;
  }

  function clearTimer() {
    if (state.timer !== null) {
      clearTimeout(state.timer);
      state.timer = null;
    }
  }

  function showSlide() {
    var playable = findPlayable(state.scenarioIdx);
    var scenario;
    var list;
    var slide;
    var durationMs;
    var startedAt;
    if (playable === null) {
      clearTimer();
      $('tv-stage').innerHTML =
        '<div class="tv-slide tv-slide--wait"><p class="tv-slide-body">Esperando contenido de la cartelera…</p></div>';
      $('tv-banner').textContent = '';
      $('tv-progress').innerHTML = '';
      return false;
    }
    state.scenarioIdx = playable;
    scenario = state.order[state.scenarioIdx];
    list = listFor(state.scenarioIdx);
    state.slideIdx = state.slideIdx % list.length;
    slide = list[state.slideIdx];
    state.slideKey += 1;
    durationMs = Math.max(3, Number(slide.duration) || 15) * 1000;
    state.currentSlides = list;
    state.currentSlideIndex = state.slideIdx;

    $('tv-stage').innerHTML = renderSlide(slide, scenario);
    activateSlideVideo();
    if (scenario === 'gallery') {
      $('tv-banner').textContent = '';
    } else {
      $('tv-banner').textContent =
        (SCENARIO_LABEL[scenario] || scenario) +
        ' (' +
        (state.slideIdx + 1) +
        '/' +
        list.length +
        ')';
    }
    buildProgressBars(list);
    startedAt = Date.now();
    startProgress(startedAt, durationMs);

    clearTimer();
    state.timer = setTimeout(function () {
      state.timer = null;
      nextSlide();
    }, durationMs);
    return true;
  }

  function nextSlide() {
    var list = listFor(state.scenarioIdx);
    var nextScenario;
    state.slideIdx += 1;
    if (state.slideIdx < list.length) {
      showSlide();
      return;
    }
    state.slideIdx = 0;
    nextScenario = findPlayable(state.scenarioIdx + 1);
    if (nextScenario === null) {
      clearTimer();
      return;
    }
    state.scenarioIdx = nextScenario;
    showSlide();
  }

  function updateData(config, scenarios) {
    var had = findPlayable(0) !== null;
    var nextOrder = normalizeOrder(config && config.scenario_order);
    var nextScenarios = ensureWelcomeScenario(scenarios, nextOrder);
    var nextFp = fingerprintData(config, nextScenarios);
    var nextBrandFp = fingerprintBranding(config);
    var contentChanged = nextFp !== state.dataFingerprint;
    var wasEnabled = isTvEnabled(state.config);
    var wasRunning = state.timer !== null;
    state.config = config || {};
    state.order = nextOrder;
    state.scenarios = nextScenarios;
    state.dataFingerprint = nextFp;
    state.brandFingerprint = nextBrandFp;
    preloadScenarioMedia(state.scenarios);
    /* Colores TV (badge/live/progress/iconos) deben aplicarse siempre. */
    applyBranding(state.config);
    if (!isTvEnabled(state.config)) {
      showTvOff();
      return;
    }
    if (state.bootIntroPlaying) {
      return;
    }
    if (!wasEnabled) {
      /* Reencendido: reiniciar carrusel desde el primer escenario reproducible. */
      state.scenarioIdx = findPlayable(0) || 0;
      state.slideIdx = 0;
      showSlide();
      return;
    }
    if (!had || !listFor(state.scenarioIdx).length) {
      state.scenarioIdx = findPlayable(0) || 0;
      state.slideIdx = 0;
    }
    /*
     * Solo re-pintar el slide si cambió el contenido. Un cambio solo de colores
     * no debe reiniciar la barra de progreso (applyBranding + syncProgressColors).
     */
    if (wasRunning && contentChanged) {
      showSlide();
    }
  }

  function resumeIfStopped() {
    if (!isTvEnabled(state.config)) {
      showTvOff();
      return false;
    }
    if (findPlayable(0) === null) {
      clearTimer();
      return false;
    }
    if (state.timer !== null) return true;
    if (!listFor(state.scenarioIdx).length) {
      state.scenarioIdx = findPlayable(0) || 0;
      state.slideIdx = 0;
    }
    return showSlide();
  }

  function schedulePoll() {
    var secs;
    var configured;
    if (state.pollTimer) clearTimeout(state.pollTimer);
    /*
     * El monitor Signage es otro dispositivo: no recibe BroadcastChannel del
     * panel (eso solo actualiza /tv-modern en el mismo navegador del PC).
     * Por eso aquí el refetch completo es el canal real de “tiempo casi real”.
     * Tope 3 s aunque config diga 30.
     */
    configured = Number(state.config.api_poll_seconds) || 3;
    secs = Date.now() < state.turboUntil ? 2 : Math.max(2, Math.min(configured, 3));
    state.pollTimer = setTimeout(poll, secs * 1000);
  }

  function fetchData() {
    var prevFp = state.dataFingerprint;
    return fetchJson('/tv').then(
      function (res) {
        state.lastUpdate = res.last_update || state.lastUpdate;
        syncServerClock(res.server_ts);
        updateData(res.config, res.scenarios);
        if (state.dataFingerprint !== prevFp) {
          state.turboUntil = Date.now() + 20000;
        }
        setConnection(true);
        maybeBootIntroThenResume();
        tickClock();
      },
      function (err) {
        setConnection(false);
        var stage = $('tv-stage');
        if (stage && !state.timer) {
          var msg = (err && err.message) ? String(err.message) : 'Sin conexión con la API';
          stage.innerHTML =
            '<div class="tv-slide tv-slide--wait"><p class="tv-slide-body" style="color:#fca5a5;">' +
            esc(msg) +
            '</p><p class="tv-slide-body" style="margin-top:1rem;opacity:.7;font-size:1.2rem;">Reintentando… Use http://' +
            (location.hostname || 'IP') +
            '/ o http://' +
            (location.hostname || 'IP') +
            '/tv/</p></div>';
        }
      }
    );
  }

  function poll() {
    /* Refetch completo (no solo ping): evita perder cambios si last_update
       no sube o el HTML viejo del Signage solo hacía heartbeat. */
    fetchData().then(schedulePoll);
  }

  function isEmbeddedPreview() {
    try {
      if (window.self !== window.top) return true;
    } catch (e) {
      return true;
    }
    try {
      var q = location.search || '';
      return /(?:^|[?&])preview=1(?:&|$)/.test(q);
    } catch (e2) {
      return false;
    }
  }

  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function isFullscreenEnabled() {
    if (isEmbeddedPreview()) return false;
    var v = state.config && state.config.tv_fullscreen;
    if (v === false || v === 0 || v === '0' || v === 'false') return false;
    return true;
  }

  function enterFullscreen() {
    var el;
    var req;
    if (!isFullscreenEnabled() || isFullscreen()) return;
    el = document.documentElement;
    req = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
    if (!req) return;
    try {
      var result = req.call(el);
      if (result && typeof result.catch === 'function') {
        result.catch(function () {});
      }
    } catch (e) {}
  }

  function tryAutoFullscreen() {
    enterFullscreen();
  }

  function onFsGesture() {
    enterFullscreen();
  }

  tickClock();
  setInterval(tickClock, 1000);
  fetchData().then(function () {
    schedulePoll();
    tryAutoFullscreen();
  });

  if (!isEmbeddedPreview()) {
    document.addEventListener('pointerdown', onFsGesture, true);
    document.addEventListener('touchstart', onFsGesture, true);
    document.addEventListener('click', onFsGesture, true);
    document.addEventListener('keydown', onFsGesture, true);
  }

  /* Admin emite cset-config-update; aplicar branding al instante si el navegador lo soporta */
  if (typeof BroadcastChannel !== 'undefined') {
    try {
      var configCh = new BroadcastChannel('cset-config-update');
      configCh.onmessage = function (e) {
        if (e.data && e.data.type === 'config-updated') {
          state.turboUntil = Date.now() + 30000;
          fetchData().then(schedulePoll);
        }
      };
    } catch (err) {}
  }
})();

</script>
