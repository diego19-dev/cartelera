# CSET: Alias /tv → public (único .htaccess en public/)
# Activar: sudo bash /var/www/html/cset/scripts/enable-cset-alias.sh
#
# URL canónica: /tv y /tv/login.php
# Bookmarks antiguos /cset → 301 a /tv

Alias /tv /var/www/html/cset/public
<Directory /var/www/html/cset/public>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
</Directory>

# Unificar: /cset → /tv
RedirectMatch 301 ^/cset/?$ /tv/
RedirectMatch 301 ^/cset/(.*)$ /tv/$1
